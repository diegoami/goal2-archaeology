name: CI

# CI minutes (the owner, 2026-10-12): no run on draft PRs; a new push cancels the run of the commit it
# supersedes; a push that changes only measured outputs runs nothing; a push to main (the PR already
# passed on its tree, or a task file, a lesson, a log committed there) runs only the quick checks.
# CI minutes (the owner, 2026-10-17, issue #297): the `checks` job runs what the change obliges
# (tools/ci_gate.py: nothing, docs, the fast tests, and each of six slow test modules only when
# the PR touches what it reads), and a merge commit made by `gh pr merge --merge` does not run
# `quick` on main again.  The whole suite still runs every night on main when code landed that day
# and on a manual run.  docs/process.md "The loop".
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.log', 'experiments/**/out/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

jobs:
  # A research PR merged with a merge commit (CLAUDE.md rule 20) lands the tree its CI just checked.
  quick:
    if: "github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request #')"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_links.py
      - run: for f in findings/F*.md; do python3 tools/check_citations.py "$f"; done
      - run: "! git ls-files | grep -iE '\\.(exe|dat|hlp|hil|pif|bat)$'"

  # Every matrix group must succeed; ci_gate.py rejects incomplete or skipped sets.
  # Ten long checkpoint cases run independently; general holds every other test.
  # A status is reported for every non-draft PR, and nightly/manual runs.  The first step chooses the tier; the others run
  # when the tier asks for them.  A green `checks` on a PR head means every obligation of the
  # whole PR's diff has been met (tools/ci_gate.py explains why a docs-only push to a code PR may
  # run less).
  checks:
    name: checks (${{ matrix.group }})
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [general, e033-01, e033-02, e033-03, e033-04, e033-05, e033-06, e033-07, e034-01, e034-02, e034-03]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: python3 tools/ci_gate.py decide >> "$GITHUB_OUTPUT"
      # Relative Markdown links resolve and JSON files parse.
      - if: steps.gate.outputs.quick == 'true'
        run: python3 tools/check_links.py
      # G2: the artifact is a release asset; the workflow's token fetches it (never committed).
      # goal2-67cf27d6 is the set the driver and new runs name (it declares the runtime writes,
      # F001); goal2-a949da2f stays fetched for tests/static, whose released-file tests read its
      # cache path. The files are identical (T11).
      - if: steps.gate.outputs.code == 'true'
        run: python3 tools/fetch_artifact.py goal2-67cf27d6
      - if: steps.gate.outputs.code == 'true'
        run: python3 tools/fetch_artifact.py goal2-a949da2f
      # The static tools need capstone, and the released-file tests the artifact fetched above.
      # The emulator tests (tests/test_emul_*.py and the other modules that import unicorn) need unicorn,
      # pinned at the 2.1.4 the engine work and E018's records use (issue #304): without it they skip.
      - if: steps.gate.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('tools/static/requirements.txt', 'runtime/emul/requirements.txt') }}
      - if: steps.gate.outputs.code == 'true'
        run: pip install -r tools/static/requirements.txt -r runtime/emul/requirements.txt
      - if: steps.gate.outputs.code == 'true' && matrix.group == 'general'
        run: python3 -m unittest discover -s tests/static -v
      # T34: the human-recorder tests need a nested X display stack (Xephyr inside Xvfb) and the
      # emulator; tests that require it skip themselves (skipUnless) when a tool is missing, so
      # the assertions still run wherever the stack is present.
      # The packages' .deb files are cached between runs (2026-10-22: the runners' Ubuntu mirror served them at a few
      # KB/s and the install, ffmpeg's ~70 dependencies, ran 40 minutes twice); a cache hit installs without
      # downloading them. A slow mirror stops the step at 15 minutes instead of holding the job.
      - if: steps.gate.outputs.code == 'true' && matrix.group == 'general'
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - if: steps.gate.outputs.code == 'true' && matrix.group == 'general'
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
            xvfb xserver-xephyr xinput xdotool x11-utils ffmpeg dosbox-x
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
      # The record tools, their tests and fixtures (the fetched checker and artifact stay in .cache/).
      # The six slow modules (tools/ci_gate.py SLOW) run only when the gate names them.
      - if: steps.gate.outputs.code == 'true'
        run: python3 tools/ci_gate.py run-tests --modules="${{ steps.gate.outputs.modules }}" --group="${{ matrix.group }}"
      # T37: every finding's citations resolve under the pinned checker (U25-U27).
      - if: steps.gate.outputs.quick == 'true'
        run: for f in findings/F*.md; do python3 tools/check_citations.py "$f"; done
      # No original file is ever in the tree (U17: they are release assets only).
      - if: steps.gate.outputs.quick == 'true'
        run: "! git ls-files | grep -iE '\\.(exe|dat|hlp|hil|pif|bat)$'"
