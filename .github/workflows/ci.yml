name: CI

# CI minutes (the owner, 2026-10-12): no run on draft PRs; a new push cancels the run of the commit it
# supersedes; a push that changes only measured outputs runs nothing; a push to main (the PR already
# passed on its tree, or a task file, a lesson, a log committed there) runs only the quick checks.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.log', 'experiments/**/out/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_links.py
      - run: for f in findings/F*.md; do python3 tools/check_citations.py "$f"; done
      - run: "! git ls-files | grep -iE '\\.(exe|dat|hlp|hil|pif|bat)$'"

  # On a PR, paths-ignore reads the whole PR's diff, so a push of logs alone to a PR that changes
  # code would still run: this gate compares the push itself (before..after) and skips the checks
  # when it touches only measured outputs. A first push, a reopen or ready_for_review always runs.
  gate:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ "$ACTION" != synchronize ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$AFTER" | grep -vqE '(\.log$|^experiments/.*/out/)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "only measured outputs changed: no checks"; echo run=false >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Relative Markdown links resolve and JSON files parse.
      - run: python3 tools/check_links.py
      # The copied harness tools run here (harness.lock pins them).
      - run: node tools/harness/review.mjs --self-test
      - run: node --test tools/harness/make-brief.test.mjs
      # G2: the artifact is a release asset; the workflow's token fetches it (never committed).
      # goal2-67cf27d6 is the set the driver and new runs name (it declares the runtime writes,
      # F001); goal2-a949da2f stays fetched for tests/static, whose released-file tests read its
      # cache path. The files are identical (T11).
      - run: python3 tools/fetch_artifact.py goal2-67cf27d6
      - run: python3 tools/fetch_artifact.py goal2-a949da2f
      # The static tools need capstone, and the released-file tests the artifact fetched above.
      - run: pip install -r tools/static/requirements.txt
      - run: python3 -m unittest discover -s tests/static -v
      # T34: the human-recorder tests need a nested X display stack (Xephyr inside Xvfb) and the
      # emulator; tests that require it skip themselves (skipUnless) when a tool is missing, so
      # the assertions still run wherever the stack is present.
      - run: sudo apt-get update && sudo apt-get install -y xvfb xserver-xephyr xinput xdotool x11-utils ffmpeg dosbox-x
      # The record tools, their tests and fixtures (the fetched checker and artifact stay in .cache/).
      - run: python3 -m unittest discover -s tests -v
      # T37: every finding's citations resolve under the pinned checker (U25-U27).
      - run: for f in findings/F*.md; do python3 tools/check_citations.py "$f"; done
      # No original file is ever in the tree (U17: they are release assets only).
      - run: "! git ls-files | grep -iE '\\.(exe|dat|hlp|hil|pif|bat)$'"
